name: Near Mosque for Windows

# Builds the Windows app on a Windows runner: an MSI for testing on a PC, and the MSIX the Microsoft Store takes
# (once the Partner Center identity is in the repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER and
# MSIX_PUBLISHER_NAME; the Store signs it on submission). Started by hand.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: MSI and MSIX
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Tests, app image and MSI
        run: ./gradlew.bat --no-daemon test createDistributable packageMsi
      - name: MSIX for the Microsoft Store
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: >
          ./msix/build-msix.ps1 -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}" -Publisher "${{ vars.MSIX_PUBLISHER }}"
          -PublisherName "${{ vars.MSIX_PUBLISHER_NAME }}" -Version "0.5.${{ github.run_number }}.0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: near-mosque-windows
          path: |
            windows/build/compose/binaries/main/msi/*.msi
            windows/build/msix/*.msix
          retention-days: 14
