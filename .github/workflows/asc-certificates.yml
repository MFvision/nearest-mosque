name: Apple development certificates

# Lists, or revokes, the development certificates that CI builds created through the App Store Connect
# API key (one per TestFlight build; unusable once the build machine is gone). Certificates made in Xcode
# on a person's own Mac and distribution certificates are never touched; names are never printed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list, or revoke-ci (revoke every development certificate created by CI)"
        required: true
        default: list

permissions:
  contents: read

jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: "pip install --quiet --only-binary :all: pyjwt==2.10.1 cryptography==44.0.0"
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python tools/asc_certificates.py "$MODE"
