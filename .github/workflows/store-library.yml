name: App Store asset library upload

# Uploads App Store media through the App Asset Library (tools/store/asc_library.py): the creative assets (product
# page header and search results videos) from an "App Store creative assets" run, or a screenshot folder (iPhone Duo)
# from an "App Store screenshots" run or from this repository (repo_folder). It only fills empty places: anything already in App Store Connect is left as
# it is. Started by hand; "discover" lists what Apple offers and changes nothing.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover, census, creative, screenshots or fill (add what a screenshot set lacks)"
        default: "discover"
      run_id:
        description: "Run ID whose artifact to upload (creative: App Store creative assets; screenshots: App Store screenshots)"
        default: ""
      folder:
        description: "screenshots: the folder in the app-store-screenshots artifact (e.g. IPHONE_DUO_OUTER)"
        default: "IPHONE_DUO_OUTER"
      repo_folder:
        description: "screenshots/fill: take the files from this repository folder instead of a run (e.g. shared/store/duo-poses)"
        default: ""
      group:
        description: "screenshots: the APP_SCREENSHOT placement group (from discover)"
        default: ""
      artifact:
        description: "creative: the artifact to upload (app-store-creative, or app-store-demo for the app preview)"
        default: "app-store-creative"
      replace:
        description: "creative: what to swap for the video where a slot is filled (empty: nothing; images; all)"
        default: ""
      groups:
        description: "creative: only these placement groups (space-separated, e.g. IPHONE_DUO_PROFILE)"
        default: ""
      locales:
        description: "creative: only these App Store Connect locales (space-separated, e.g. ar-SA en-US en-GB)"
        default: ""
      dry_run:
        description: "Only report what would be uploaded"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: store-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Get the files
        if: inputs.mode != 'discover' && inputs.mode != 'census'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          MODE: ${{ inputs.mode }}
          ARTIFACT: ${{ inputs.artifact }}
          FOLDER: ${{ inputs.folder }}
          REPO_FOLDER: ${{ inputs.repo_folder }}
        run: |
          if [ -n "$REPO_FOLDER" ]; then mkdir -p "media/$FOLDER" && cp -R "$REPO_FOLDER"/. "media/$FOLDER/"
          elif [ "$MODE" = creative ]; then gh run download "$RUN_ID" -n "$ARTIFACT" -D media
          else gh run download "$RUN_ID" -n app-store-screenshots -D media; fi
      - name: Install the script's dependencies (pinned)
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m venv /tmp/asc && /tmp/asc/bin/pip install --quiet --only-binary :all: pyjwt==2.10.1 cryptography==44.0.0
      - name: Upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUNDLE_ID: sa.zood.nearmosque
          DRY_RUN: ${{ inputs.dry_run }}
          MODE: ${{ inputs.mode }}
          FOLDER: ${{ inputs.folder }}
          GROUP: ${{ inputs.group }}
          REPLACE: ${{ inputs.replace }}
          GROUPS: ${{ inputs.groups }}
          LOCALES: ${{ inputs.locales }}
        run: |
          case "$MODE" in
            discover|census) /tmp/asc/bin/python tools/store/asc_library.py "$MODE" ;;
            creative) /tmp/asc/bin/python tools/store/asc_library.py creative media ;;
            screenshots|fill) /tmp/asc/bin/python tools/store/asc_library.py "$MODE" "media/$FOLDER" "$GROUP" ;;
            *) echo "::error::mode must be discover, creative or screenshots"; exit 1 ;;
          esac
