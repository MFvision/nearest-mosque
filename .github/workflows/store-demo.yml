name: App Store demo preview

# Cuts the demo preview of every store language (tools/store/creative/demo.py) from an "App Store previews" run's
# recorded tours, into the artifact app-store-demo (demo/<locale>.mp4) that "App Store asset library upload"
# places as the app preview. Started by hand.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run IDs of App Store previews runs whose recordings to cut (space-separated; later ones win)"
        required: true
      languages:
        description: "App language codes to cut (empty: every language recorded)"
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Get the recordings
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p previews
          for id in $RUN_ID; do
            gh run download "$id" --pattern 'previews-*' --dir "rec/$id"
            for d in "rec/$id"/previews-*; do cp -R "$d/." previews/; done
          done
          find previews -name '*.mp4' | wc -l
      - name: Cut
        env:
          LANGS: ${{ inputs.languages }}
        # shellcheck disable=SC2086 # the language list is meant to split into arguments
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet numpy
          /tmp/venv/bin/python tools/store/creative/demo.py previews demo/demo $LANGS
          find demo -name '*.mp4' | sort | sed 's|^demo/||' | tee -a "$GITHUB_STEP_SUMMARY" | wc -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-store-demo
          path: demo/
          retention-days: 30
