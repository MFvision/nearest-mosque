name: App Store demo preview

# Cuts the demo preview of every store language (tools/store/creative/demo.py) from an "App Store previews" run's
# recorded tours, into the artifact app-store-demo (demo/<locale>.mp4) that "App Store asset library upload"
# places as the app preview. Started by hand.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run IDs of App Store previews runs whose recordings to cut (space-separated; later ones win)"
        required: true
      languages:
        description: "App language codes to cut (empty: every language recorded)"
        default: ""
      device:
        description: "iphone, or duo (recordings from the iPhone Duo simulator, framed in Apple's 886 x 1920)"
        default: "iphone"

permissions:
  contents: read
  actions: read

jobs:
  cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Get the recordings
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p previews
          for id in $RUN_ID; do
            gh run download "$id" --pattern 'previews-*' --dir "rec/$id"
            for d in "rec/$id"/previews-*; do cp -R "$d/." previews/; done
          done
          find previews -name '*.mp4' | wc -l
      - name: The iPhone Duo frame (night sky, rounded corners, the phrase per language)
        if: inputs.device == 'duo'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet numpy pillow
          cd tools/store/creative && npm install --no-save --silent playwright@1.56.1 && npx playwright install --with-deps chromium >/dev/null
          mkdir -p "$RUNNER_TEMP/frame"
          SKY='{"horizon":0.93,"mosque":0.05,"arc":false}' node render.mjs still "$RUNNER_TEMP/frame/background.png" 886 1920 0.74
          for l in $(python3 -c "import json; print(' '.join(json.load(open('../../../shared/store/creative.json'))['phrase']))"); do
            p=$(python3 -c "import json,sys; print(json.load(open('../../../shared/store/creative.json'))['phrase'][sys.argv[1]])" "$l")
            node render.mjs text "$RUNNER_TEMP/frame/$l.png" 886 1920 "$l" "$p" 0.03 0.083 0.06,0.94
          done
          /tmp/venv/bin/python -c "
          from PIL import Image, ImageDraw
          m = Image.new('L', (886, 1288), 0); ImageDraw.Draw(m).rounded_rectangle((0, 0, 885, 1287), radius=48, fill=255)
          m.save('$RUNNER_TEMP/frame/mask.png')"
          echo "DUO_FRAME=$RUNNER_TEMP/frame" >> "$GITHUB_ENV"
      - name: Cut
        env:
          LANGS: ${{ inputs.languages }}
        # shellcheck disable=SC2086 # the language list is meant to split into arguments
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet numpy
          /tmp/venv/bin/python tools/store/creative/demo.py previews demo/demo $LANGS
          find demo -name '*.mp4' | sort | sed 's|^demo/||' | tee -a "$GITHUB_STEP_SUMMARY" | wc -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-store-demo
          path: demo/
          retention-days: 30
