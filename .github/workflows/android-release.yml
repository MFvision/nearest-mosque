name: Android release (Google Play)

# Builds the minified, shrunk release (App Bundle for Google Play, APK for side-loading checks) and keeps both
# with the R8 mapping as artifacts. Signs with the upload key when its secrets exist, and puts the bundle on a
# Google Play track as a draft release when asked and a service account exists. Without the secrets those steps
# are skipped with a notice. Setup: docs/12-google-play.md.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track for the draft release"
        type: choice
        options: [internal, closed, production]
        default: internal
      upload:
        description: "Upload the bundle to Google Play as a draft release (needs PLAY_SERVICE_ACCOUNT_JSON)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and (optionally) upload
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Version code
        id: version
        # Above every local build (versionCode 1) and higher on every run of this workflow.
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Which secrets are set
        id: secrets
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          missing=""
          [ "$HAS_KEYSTORE" = true ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ "$HAS_STORE_PASSWORD" = true ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ "$HAS_ALIAS" = true ] || missing="$missing ANDROID_KEY_ALIAS"
          [ "$HAS_KEY_PASSWORD" = true ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -z "$missing" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "The upload key secrets are set: the release will be signed."
          elif [ "$HAS_KEYSTORE$HAS_STORE_PASSWORD$HAS_ALIAS$HAS_KEY_PASSWORD" = falsefalsefalsefalse ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned build::No upload key secrets are set, so the bundle and APK are built unsigned (Google Play does not accept them). See docs/12-google-play.md."
          else
            echo "::error title=Incomplete signing secrets::Some upload key secrets are set but these are missing:$missing"
            exit 1
          fi
          echo "play=$HAS_PLAY" >> "$GITHUB_OUTPUT"

      - name: Unit and Robolectric tests
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Decode the upload keystore
        if: steps.secrets.outputs.sign == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          [ -s "$RUNNER_TEMP/upload.jks" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a file."; exit 1; }
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle and APK (versionCode ${{ steps.version.outputs.code }})
        working-directory: android
        env:
          # Read by app/build.gradle.kts only together with ANDROID_KEYSTORE_FILE; empty when not signing.
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.secrets.outputs.sign == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.secrets.outputs.sign == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.secrets.outputs.sign == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon -PversionCode="$VERSION_CODE" :app:bundleRelease :app:assembleRelease

      - name: Check the outputs and their signatures
        id: out
        env:
          SIGN: ${{ steps.secrets.outputs.sign }}
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          [ -f "$AAB" ] && [ -f "$APK" ] && [ -f android/app/build/outputs/mapping/release/mapping.txt ]
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -1)
          echo "release_name=$VERSION_NAME ($VERSION_CODE)" >> "$GITHUB_OUTPUT"
          echo "Bundle: $(du -h "$AAB" | cut -f1), APK: $(du -h "$APK" | cut -f1), version $VERSION_NAME ($VERSION_CODE)"
          if [ "$SIGN" = true ]; then
            # Verified quietly: the certificate's subject (which can hold a person's name) is never printed.
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" verify "$APK" > /dev/null
            verify=$(jarsigner -verify "$AAB" 2>&1 || true)
            case "$verify" in *"jar verified"*) ;; *) echo "::error::The bundle is not signed."; exit 1 ;; esac
            echo "The APK and the bundle are signed with the upload key."
          fi
          {
            echo "### Android release $VERSION_NAME ($VERSION_CODE)"
            echo "- Bundle $(du -h "$AAB" | cut -f1), APK $(du -h "$APK" | cut -f1)"
            echo "- Signed with the upload key: $SIGN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-${{ steps.version.outputs.code }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Why the Google Play upload is skipped
        if: inputs.upload && (steps.secrets.outputs.play != 'true' || steps.secrets.outputs.sign != 'true')
        env:
          PLAY: ${{ steps.secrets.outputs.play }}
          SIGN: ${{ steps.secrets.outputs.sign }}
        run: |
          [ "$PLAY" = true ] || echo "::notice title=Google Play upload skipped::PLAY_SERVICE_ACCOUNT_JSON is not set. The bundle is in the artifacts; see docs/12-google-play.md."
          [ "$SIGN" = true ] || echo "::notice title=Google Play upload skipped::The bundle is unsigned (no upload key secrets), and Google Play accepts only bundles signed with the upload key."

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: inputs.upload && steps.secrets.outputs.play == 'true' && steps.secrets.outputs.sign == 'true'
        with:
          python-version: "3.12"

      - name: Upload to Google Play as a draft release (${{ inputs.track }})
        if: inputs.upload && steps.secrets.outputs.play == 'true' && steps.secrets.outputs.sign == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.AVA.nearmosque
          TRACK: ${{ inputs.track }}
          RELEASE_NAME: ${{ steps.out.outputs.release_name }}
          AAB: ${{ steps.out.outputs.aab }}
        run: |
          python3 -m venv /tmp/play && /tmp/play/bin/pip install --quiet --only-binary :all: pyjwt==2.10.1 cryptography==44.0.0
          /tmp/play/bin/python tools/store/play_upload.py "$AAB"
