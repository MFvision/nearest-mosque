name: TestFlight status

# Reports the app's latest TestFlight builds and, for a processed build, answers export compliance and
# gives internal tester groups access. Optional input: a build number (default: newest).
on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number (empty = newest)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    env:
      BUNDLE_ID: sa.zood.nearmosque
      BUILD_NUMBER: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: "pip install --quiet --only-binary :all: pyjwt==2.10.1 cryptography==44.0.0"
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python tools/asc_testflight.py
