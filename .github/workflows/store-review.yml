name: App Store review submissions

# Shows the App Store versions and open review submissions, cancels the ones waiting for review so a version's
# build, screenshots and text can change again, or attaches a processed build to each platform's editable version
# and submits it for review with automatic release (tools/store/asc_review.py). Started by hand.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status (read only), cancel (take versions out of review) or submit (attach the build, send for review)"
        type: choice
        options: [status, cancel, submit]
        default: status
      confirm:
        description: "Really cancel or submit (off: report what would be done)"
        type: boolean
        default: false
      platforms:
        description: "App Store platforms, space-separated"
        default: "IOS MAC_OS TV_OS VISION_OS"
      build:
        description: "submit: the build number to attach, e.g. 146"
        default: ""

permissions:
  contents: read

concurrency:
  group: store-upload
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the script's dependencies (pinned)
        run: "python3 -m venv /tmp/asc && /tmp/asc/bin/pip install --quiet --only-binary :all: pyjwt==2.10.1 cryptography==44.0.0"
      - name: Review submissions
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUNDLE_ID: sa.zood.nearmosque
          PLATFORMS: ${{ inputs.platforms }}
          CONFIRM: ${{ inputs.confirm }}
          ACTION: ${{ inputs.action }}
          BUILD: ${{ inputs.build }}
        run: /tmp/asc/bin/python tools/store/asc_review.py "$ACTION"
