name: Google Play graphics

# The Google Play store graphics for every app language: 8 screenshots each for the phone (1080 x 1920), 7-inch
# (Galaxy Z Fold inner screen, 1811 x 2176) and 10-inch (tablet sideways, 2560 x 1440) slots, 7 each (no widgets)
# for the Chromebook slot (desktop window, 2880 x 1620) and the Android XR slot (the app's panel in a space,
# 3840 x 2160). In store order: 01 prayer, 02 weather (Sky follows the weather on, a fixed rain demo; no network),
# 03 Qibla, 04 mosques, 05 Ask, 06 library, 07 widgets (not on Chromebook or XR), 08 silence during prayer;
# rendered from the real screens under Robolectric (android/app/src/test/.../StoreScreenshotTest.kt),
# the 512 x 512 icon and a 1024 x 500 feature graphic per language (tools/store/play_graphics.py), with a manifest.
# Started by hand; uploads nothing to Google Play (the artifact "play-store-assets" holds the files). The Google Play
# Developer API has no image type for the Chromebook and Android XR slots: <lang>/desktop and <lang>/xr go up by
# hand in Play Console (manifest.json "consoleSlots").

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "App language codes, space-separated (all: every enabled language of shared/i18n/languages.json)"
        default: "all"
      devices:
        description: "Screenshot slots, space-separated (phone seven ten desktop xr)"
        default: "phone seven ten desktop xr"

permissions:
  contents: read

concurrency:
  group: store-play-assets
  cancel-in-progress: true

jobs:
  graphics:
    name: Screenshots, icon and feature graphics
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The screenshots use the fonts Robolectric ships with its native graphics (Android's own Noto set); the
      # feature graphics need Noto fonts for every script and FriBiDi for Pillow's raqm text layout.
      - name: Fonts and text layout
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-noto-core fonts-noto-cjk libfribidi0 libraqm0
          python -m pip install -q pillow python-bidi arabic-reshaper
          python -c "from PIL import features; print('raqm:', features.check('raqm'))"
      - name: Screenshots (phone, 7-inch, 10-inch, Chromebook, Android XR)
        working-directory: android
        env:
          LANGS: ${{ inputs.languages }}
          DEVICES: ${{ inputs.devices }}
        run: |
          [ "$LANGS" = "all" ] && LANGS=""
          ./gradlew --no-daemon :app:testDebugUnitTest -PstoreShots=true -PstoreLangs="$LANGS" -PstoreDevices="$DEVICES" \
            -Proborazzi.test.record=true --tests 'sa.zood.nearmosque.StoreScreenshotTest'
      - name: Icon, feature graphics, XR scenes and checks
        env:
          LANGS: ${{ inputs.languages }}
          DEVICES: ${{ inputs.devices }}
        run: |
          [ "$LANGS" = "all" ] && LANGS=""
          python tools/store/play_graphics.py --shots android/app/build/store-play --out build/store-play --languages "$LANGS" \
            --slots "$DEVICES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: play-store-assets
          retention-days: 30
          if-no-files-found: error
          path: build/store-play/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: play-store-test-results
          retention-days: 7
          path: android/app/build/test-results/testDebugUnitTest/*StoreScreenshotTest*.xml
