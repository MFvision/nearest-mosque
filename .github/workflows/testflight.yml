name: Nearest Mosque TestFlight

# Builds the iPhone and iPad app, and the Mac app (Mac Catalyst), signs them with the App Store Connect
# API key (Xcode automatic signing, cloud-managed distribution certificate) and uploads them to TestFlight.
# Start it from the Actions tab (Run workflow) or by pushing a tag such as `ios-v1`.
# Needs three repository secrets (see docs/07-testflight.md):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (contents of the .p8 file)
# The Team ID is not secret and lives in ios/project.yml (override with an APPLE_TEAM_ID secret).
on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:
    inputs:
      mac_only:
        description: "Only the Mac app (skip the iPhone and iPad upload)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      build: ${{ steps.number.outputs.build }}
    defaults:
      run:
        working-directory: ios
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'AWV883QWPU' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUNDLE_ID: sa.zood.nearmosque
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; missing=1; fi
          done
          exit $missing

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install the API key
        id: number
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          # Monotonic build number: one per workflow run (TestFlight rejects duplicates).
          echo "BUILD_NUMBER=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"
          echo "build=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - name: Archive (Release, automatic signing)
        if: ${{ !inputs.mac_only }}
        run: |
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/NearMosque.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            APP_BUNDLE_ID="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tee archive.log | grep -E "error:|warning: .*(signing|provision)|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Write the export options
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Export and upload to App Store Connect
        if: ${{ !inputs.mac_only }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/NearMosque.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log | grep -E "error|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" export.log
          echo "Uploaded build $BUILD_NUMBER of $BUNDLE_ID. It appears in TestFlight after Apple finishes processing (usually 5-30 minutes)."

      # The Mac app (Mac Catalyst, same bundle id): a separate macOS build in TestFlight. Allowed to fail
      # on its own so it never holds back the iPhone and iPad build above. Signed for the App Store at
      # archive time: a development profile would need a registered Mac, and CI's Macs are throwaway.
      - name: Archive the Mac app (Mac Catalyst)
        id: mac_archive
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -archivePath build/NearMosque-mac.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            APP_BUNDLE_ID="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tee mac-archive.log | grep -E "error:|warning: .*(signing|provision)|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" mac-archive.log

      - name: Export and upload the Mac app
        if: steps.mac_archive.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/NearMosque-mac.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export-mac -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee mac-export.log | grep -E "error|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" mac-export.log
          echo "Uploaded Mac build $BUILD_NUMBER of $BUNDLE_ID."

      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export.log
            ios/mac-archive.log
            ios/mac-export.log

  # Waiting for Apple's processing runs on Linux: the repository is private, and macOS minutes count
  # several times against the Actions allowance.
  testers:
    name: Wait for Apple processing and give internal testers access
    needs: testflight
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUNDLE_ID: sa.zood.nearmosque
      BUILD_NUMBER: ${{ needs.testflight.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - name: Wait, answer export compliance, add the build to internal groups
        run: |
          python3 -m venv /tmp/asc && /tmp/asc/bin/pip install --quiet pyjwt cryptography
          WAIT_MINUTES=60 PLATFORMS=${{ inputs.mac_only && 'MAC_OS' || 'IOS,MAC_OS' }} /tmp/asc/bin/python tools/asc_testflight.py

  # The archive step's automatic signing creates a development certificate on each fresh machine; it is
  # useless once the machine is gone and Apple caps how many an account holds, so revoke this run's.
  certificates:
    name: Revoke this build's development certificate
    needs: testflight
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Revoke development certificates created in the last hours by CI
        run: |
          python3 -m venv /tmp/asc && /tmp/asc/bin/pip install --quiet pyjwt cryptography
          /tmp/asc/bin/python tools/asc_certificates.py revoke-recent
