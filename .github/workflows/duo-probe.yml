name: iPhone Duo simulator probe

# Temporary: learns how the iPhone Duo simulator (Xcode 27.1) exposes its displays and folding, for the
# App Store screenshot pipeline. Started by hand; uploads nothing to Apple.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Xcode 27.1 and the iPhone Duo simulator
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          xcrun simctl list devicetypes -j | python3 -c "import json,sys; [print(json.dumps(t, indent=1)) for t in json.load(sys.stdin)['devicetypes'] if 'Duo' in t['name']]"
          # The iPhone Duo needs the iOS 27.1 simulator runtime (the image ships 27.0).
          xcrun simctl list runtimes | grep -q "iOS 27.1" || xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes
          xcrun simctl help 2>&1 | tee ../simctl-help.txt
          for c in io ui status_bar; do echo "== $c"; xcrun simctl help $c 2>&1 | head -80; done | tee ../simctl-sub.txt
      - name: Build the app
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -3
      - name: Boot, try the displays, screenshot
        timeout-minutes: 20
        run: |
          set -x
          # Each simulator command gets a time limit (macOS has no timeout(1)).
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable'] and x['version'].startswith('27.1')]; print(r[-1]['identifier'])")
          UDID=$(xcrun simctl create "Duo probe" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$RT")
          t 90 xcrun simctl boot "$UDID" || true
          t 300 xcrun simctl bootstatus "$UDID" -b || echo "::warning::bootstatus did not finish in 5 minutes"
          t 90 xcrun simctl io "$UDID" enumerate | tee ../io-enumerate.txt || true
          t 90 xcrun simctl install "$UDID" dd/Build/Products/Debug-iphonesimulator/NearMosque.app
          t 90 xcrun simctl privacy "$UDID" grant location sa.zood.nearmosque || true
          t 90 xcrun simctl location "$UDID" set 24.7136,46.6753 || true
          t 90 xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 || true
          t 90 xcrun simctl launch "$UDID" sa.zood.nearmosque -demoCity Riyadh -demoTab prayer -languageOverride en
          sleep 15
          mkdir -p ../probe
          t 90 xcrun simctl io "$UDID" screenshot ../probe/default.png || true
          t 60 xcrun simctl io "$UDID" screenshot --display=1 ../probe/outer.png || true
          # Unfold: the outer display (1) off, the inner one (3) on; the app moves to the inner display.
          t 90 xcrun simctl io "$UDID" screenConfig --display=1 power off || true
          t 90 xcrun simctl io "$UDID" screenConfig --display=3 power on || true
          sleep 6
          t 90 xcrun simctl terminate "$UDID" sa.zood.nearmosque || true
          t 90 xcrun simctl launch "$UDID" sa.zood.nearmosque -demoCity Riyadh -demoTab prayer -languageOverride en
          sleep 15
          t 60 xcrun simctl io "$UDID" screenshot --display=3 ../probe/inner.png || true
          t 90 xcrun simctl launch "$UDID" sa.zood.nearmosque -demoCity Riyadh -demoTab mosques -languageOverride en || true
          sleep 15
          t 60 xcrun simctl io "$UDID" screenshot --display=3 ../probe/inner-mosques.png || true
          t 90 xcrun simctl io "$UDID" enumerate | grep -iE "Screen ID|Name:|Power state" | head -20 || true
          python3 -c "
          from PIL import Image
          import glob
          for f in sorted(glob.glob('../probe/*.png')): print(f, Image.open(f).size)" 2>/dev/null || sips -g pixelWidth -g pixelHeight ../probe/*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: duo-probe
          path: |
            probe/
            simctl-help.txt
            simctl-sub.txt
            io-enumerate.txt
          retention-days: 3
