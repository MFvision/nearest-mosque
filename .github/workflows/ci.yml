name: Nearest Mosque apps

on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repository is private: macOS minutes count several times against the Actions allowance, so the
  # iOS job runs only when iOS code, shared assets or packs change (always on manual runs and PRs).
  changes:
    name: Decide which platform jobs run
    runs-on: ubuntu-24.04
    outputs:
      ios: ${{ steps.c.outputs.ios }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: c
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(ios/|shared/|packs/|\.github/workflows/ci\.yml)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  shared:
    name: Shared strings and fixtures are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strings generated from shared/i18n/strings.json
        run: python3 tools/gen_strings.py --check
      - name: Design tokens (contrast, theme parity)
        run: python3 tools/check_tokens.py
      - name: Golden fixtures regenerate identically
        run: |
          python3 tools/gen_fixtures.py
          python3 tools/reference_search.py --gen
          python3 tools/library_search.py --gen
          python3 tools/semantic.py --gen
          python3 tools/refresh_questions.py
          git diff --exit-code -- shared/fixtures packs/sources/quran-tanzil-pickthall

  android:
    name: Android (unit, Robolectric, screenshots, APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:recordRoborazziDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots-and-apk
          path: |
            android/app/build/screenshots/*.png
            android/app/build/outputs/apk/debug/*.apk
            android/*/build/test-results/**/*.xml

  swift-linux:
    name: NearestMosqueKit on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: swift test
        working-directory: ios/Packages/NearestMosqueKit
        # NMCore here; the data-layer tests (which install the large library packs) run in the Linux job.
        run: swift test --filter NMCoreTests

  ios:
    name: iOS app (Xcode, simulator build) and package tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Package tests (macOS, CryptoKit path)
        working-directory: ios/Packages/NearestMosqueKit
        run: swift test
      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: .*NearMosque|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Release build for devices (unsigned, same configuration TestFlight uses)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tee release.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" release.log
      - name: Run in the iOS Simulator and capture screenshots
        working-directory: ios
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          rts=sorted([k for k in d if 'iOS' in k], key=lambda k: [int(x) for x in k.split('iOS-')[-1].split('-')])
          for rt in reversed(rts):
              for dev in d[rt]:
                  if dev['name'].startswith('iPhone') and 'Pro' in dev['name'] and 'Max' not in dev['name']:
                      print(dev['udid']); sys.exit()
          ")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build -quiet
          APP=dd/Build/Products/Debug-iphonesimulator/NearMosque.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location sa.zood.nearmosque || true
          xcrun simctl location "$UDID" set -33.9249,18.4241 || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          mkdir -p shots
          # The app follows the phone's appearance: shots in light mode first, then a few in dark mode.
          xcrun simctl ui "$UDID" appearance light || true
          shot() { name=$1; shift
            xcrun simctl terminate "$UDID" sa.zood.nearmosque 2>/dev/null || true
            xcrun simctl launch "$UDID" sa.zood.nearmosque "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot 01-onboarding-welcome -demoOnboarding YES -demoOnboardingPage 0 -languageOverride en
          shot 02-onboarding-qibla -demoOnboarding YES -demoOnboardingPage 2 -languageOverride en
          shot 03-onboarding-mosque -demoOnboarding YES -demoOnboardingPage 3 -languageOverride en
          shot 04-onboarding-ask -demoOnboarding YES -demoOnboardingPage 4 -languageOverride en
          shot 04b-onboarding-setup -demoOnboarding YES -demoOnboardingPage 5 -languageOverride en
          shot 05-prayer-en -demoCity "Cape Town" -demoTab prayer -languageOverride en
          shot 06-prayer-ar -demoCity "Cape Town" -demoTab prayer -languageOverride ar
          shot 06b-qibla-compass -demoCity "Cape Town" -demoTab prayer -demoCompass YES -languageOverride en
          shot 06c-compact-bar -demoCity "Cape Town" -demoTab prayer -demoCompact YES -languageOverride en
          shot 06d-compact-bar-ar -demoCity "Cape Town" -demoTab prayer -demoCompact YES -languageOverride ar
          shot 07-mosques-compass -demoCity "Cape Town" -demoTab mosques -demoMosqueMode 0 -languageOverride en
          shot 08-mosques-map -demoCity "Cape Town" -demoTab mosques -demoMosqueMode 1 -languageOverride en
          shot 08b-full-map -demoCity "Cape Town" -demoTab mosques -demoFullMap YES -languageOverride en
          shot 08c-full-map-ar -demoCity "Cape Town" -demoTab mosques -demoFullMap YES -languageOverride ar
          shot 09-ask-answer -demoCity "Cape Town" -demoTab ask -demoAsk YES -languageOverride en
          shot 10-ask-ar -demoCity "Cape Town" -demoTab ask -languageOverride ar
          # Home-screen widgets at their real sizes (debug gallery; same views as the widget extension).
          shot 17-widgets-next -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind next -demoWidgetLook cream -languageOverride en
          shot 18-widgets-countdown -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind countdown -demoWidgetLook green -languageOverride en
          shot 19-widgets-today -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind today -demoWidgetLook night -languageOverride en
          shot 20-widgets-next-ar -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind next -demoWidgetLook green -languageOverride ar
          shot 21-widgets-today-ar -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind today -demoWidgetLook cream -languageOverride ar
          shot 22-widgets-mosque -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind mosque -demoWidgetLook cream -languageOverride en
          shot 23-widgets-ask-ar -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind ask -demoWidgetLook night -languageOverride ar
          shot 24-widgets-ring-ar -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind ring -demoWidgetLook cream -languageOverride ar
          shot 25-widgets-ring -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind ring -demoWidgetLook night -languageOverride en
          shot 26-widgets-qibla -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind qibla -demoWidgetLook green -languageOverride en
          shot 27-widgets-qibla-ar -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind qibla -demoWidgetLook cream -languageOverride ar
          shot 28-widgets-actions -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind actions -demoWidgetLook night -languageOverride en
          shot 28b-widgets-qibla-teal-ar -demoCity "Riyadh" -demoWidgets YES -demoWidgetKind qibla -demoWidgetLook teal -languageOverride ar
          shot 28c-widgets-ring-sky-ar -demoCity "Riyadh" -demoWidgets YES -demoWidgetKind ring -demoWidgetLook sky -languageOverride ar
          shot 28d-widgets-next-ar -demoCity "Riyadh" -demoWidgets YES -demoWidgetKind next -demoWidgetLook cream -languageOverride ar
          shot 28e-widgets-countdown-ar -demoCity "Riyadh" -demoWidgets YES -demoWidgetKind countdown -demoWidgetLook cream -languageOverride ar
          shot 28f-widgets-tasbih-teal -demoCity "Riyadh" -demoWidgets YES -demoWidgetKind tasbih -demoWidgetLook teal -languageOverride ar
          shot 28g-island-gold-ar -demoCity "Riyadh" -demoWidgets YES -demoWidgetKind island -demoWidgetLook cream -languageOverride ar
          shot 28h-island-teal-en -demoCity "Riyadh" -demoWidgets YES -demoWidgetKind island -demoWidgetLook teal -languageOverride en
          xcrun simctl ui "$UDID" appearance dark || true
          shot 11-prayer-dark -demoCity "Cape Town" -demoTab prayer -languageOverride en
          shot 11b-compact-bar-dark -demoCity "Cape Town" -demoTab prayer -demoCompact YES -languageOverride en
          shot 12-mosques-dark -demoCity "Cape Town" -demoTab mosques -demoMosqueMode 0 -languageOverride en
          shot 13-ask-answer-dark -demoCity "Cape Town" -demoTab ask -demoAsk YES -languageOverride en
          # Large text (Settings → Accessibility → Larger Text): nothing may be cut or overlap.
          xcrun simctl ui "$UDID" content_size accessibility-medium || true
          shot 14-prayer-large-text -demoCity "Cape Town" -demoTab prayer -languageOverride en
          shot 15-compact-bar-large-text -demoCity "Cape Town" -demoTab prayer -demoCompact YES -languageOverride en
          shot 16-ask-large-text -demoCity "Cape Town" -demoTab ask -languageOverride en
          xcrun simctl ui "$UDID" content_size medium || true
          xcrun simctl shutdown "$UDID" || true
          # iPad (same universal app): portrait and landscape, English and Arabic, and the widgets.
          IPAD=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          rts=sorted([k for k in d if 'iOS' in k], key=lambda k: [int(x) for x in k.split('iOS-')[-1].split('-')])
          for rt in reversed(rts):
              for dev in d[rt]:
                  if dev['name'].startswith('iPad Pro') and '13' in dev['name']:
                      print(dev['udid']); sys.exit()
              for dev in d[rt]:
                  if dev['name'].startswith('iPad'):
                      print(dev['udid']); sys.exit()
          ")
          if [ -n "$IPAD" ]; then
            echo "iPad simulator $IPAD"
            xcrun simctl boot "$IPAD" || true
            xcrun simctl bootstatus "$IPAD" -b
            xcrun simctl install "$IPAD" "$APP"
            xcrun simctl privacy "$IPAD" grant location sa.zood.nearmosque || true
            xcrun simctl location "$IPAD" set -33.9249,18.4241 || true
            xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryLevel 100 || true
            xcrun simctl ui "$IPAD" appearance light || true
            mkdir -p shots/ipad
            ipad() { name=$1; shift
              xcrun simctl terminate "$IPAD" sa.zood.nearmosque 2>/dev/null || true
              xcrun simctl launch "$IPAD" sa.zood.nearmosque "$@"
              sleep 10
              xcrun simctl io "$IPAD" screenshot "shots/ipad/$name.png"
            }
            ipad 01-prayer -demoCity "Cape Town" -demoTab prayer -languageOverride en
            ipad 02-prayer-landscape -demoCity "Cape Town" -demoTab prayer -demoLandscape YES -languageOverride en
            ipad 03-prayer-ar -demoCity "Cape Town" -demoTab prayer -languageOverride ar
            ipad 04-qibla -demoCity "Cape Town" -demoTab prayer -demoCompass YES -languageOverride en
            ipad 05-mosques-map -demoCity "Cape Town" -demoTab mosques -demoMosqueMode 1 -languageOverride en
            ipad 06-mosques-landscape -demoCity "Cape Town" -demoTab mosques -demoMosqueMode 1 -demoLandscape YES -languageOverride en
            ipad 07-ask-answer -demoCity "Cape Town" -demoTab ask -demoAsk YES -languageOverride en
            ipad 08-ask-landscape -demoCity "Cape Town" -demoTab ask -demoAsk YES -demoLandscape YES -languageOverride en
            ipad 09-onboarding -demoOnboarding YES -demoOnboardingPage 0 -languageOverride en
            ipad 10-widgets-today -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind today -demoWidgetLook cream -languageOverride en
            ipad 10b-widgets-ring -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind ring -demoWidgetLook night -languageOverride en
            ipad 10c-mosques-compass -demoCity "Cape Town" -demoTab mosques -demoMosqueMode 0 -languageOverride ar
            xcrun simctl ui "$IPAD" appearance dark || true
            ipad 11-prayer-dark-landscape -demoCity "Cape Town" -demoTab prayer -demoLandscape YES -languageOverride ar
            xcrun simctl shutdown "$IPAD" || true
          fi
          ls -la shots
          # Contact sheet for quick review.
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet pillow
          /tmp/venv/bin/python - <<'PY'
          import glob
          from PIL import Image
          ims = [Image.open(f).convert("RGB") for f in sorted(glob.glob("shots/*.png"))]
          w = 300; h = int(ims[0].height * w / ims[0].width); cols = 6
          sheet = Image.new("RGB", (cols * w, ((len(ims) + cols - 1) // cols) * h), "white")
          for i, im in enumerate(ims):
              sheet.paste(im.resize((w, h)), ((i % cols) * w, (i // cols) * h))
          sheet.save("shots/contact-sheet.jpg", quality=80)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: ios/shots/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ios/build.log
      # The Mac app (Mac Catalyst): built from the same code, launched on this Mac and screenshotted.
      - name: Build and run the Mac app (Mac Catalyst)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath ddmac \
            CODE_SIGNING_ALLOWED=NO build | tee mac.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" mac.log
          APP="$PWD/ddmac/Build/Products/Debug-maccatalyst/NearMosque.app"
          mkdir -p shots-mac
          mac() { name=$1; shift
            pkill -x NearMosque 2>/dev/null || true
            sleep 2
            open -n "$APP" --args "$@"
            sleep 14
            screencapture -x "shots-mac/$name.png" || true
          }
          mac 01-prayer -demoCity "Cape Town" -demoTab prayer -languageOverride en
          mac 02-prayer-ar -demoCity "Cape Town" -demoTab prayer -languageOverride ar
          mac 03-mosques -demoCity "Cape Town" -demoTab mosques -demoMosqueMode 1 -languageOverride en
          mac 04-ask -demoCity "Cape Town" -demoTab ask -demoAsk YES -languageOverride en
          mac 05-qibla -demoCity "Cape Town" -demoTab prayer -demoCompass YES -languageOverride en
          mac 06-widgets -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind today -demoWidgetLook night -languageOverride en
          pkill -x NearMosque 2>/dev/null || true
          ls -la shots-mac
      # The TestFlight Mac app is a Release build in the App Sandbox. Same here (signed ad hoc, without the
      # keychain group, which needs a profile): it must still be running after a while, else print why.
      - name: Mac app in the sandbox (Release) stays up
        working-directory: ios
        run: |
          set -o pipefail
          cat > /tmp/sandbox.entitlements <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.network.client</key><true/>
            <key>com.apple.security.personal-information.location</key><true/>
          </dict></plist>
          XML
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath ddrel \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee macrel.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" macrel.log
          APP="$PWD/ddrel/Build/Products/Release-maccatalyst/NearMosque.app"
          # Sign inside out, ad hoc: frameworks and the widgets, then the app with the sandbox.
          find "$APP/Contents" \( -name "*.framework" -o -name "*.dylib" \) -prune -exec codesign -f -s - {} \; 2>/dev/null || true
          for x in "$APP"/Contents/PlugIns/*.appex; do codesign -f -s - --entitlements /tmp/sandbox.entitlements "$x"; done
          codesign -f -s - --entitlements /tmp/sandbox.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | head -20 || true
          rm -rf ~/Library/Logs/DiagnosticReports/NearMosque* 2>/dev/null || true
          open -n "$APP"
          sleep 25
          if pgrep -x NearMosque >/dev/null; then
            echo "Release Mac app is running in the sandbox."
            mkdir -p shots-mac && screencapture -x shots-mac/10-release-first-launch.png || true
            pkill -x NearMosque || true
          else
            echo "::error::The Release Mac app quit within 25 seconds."
            for f in ~/Library/Logs/DiagnosticReports/NearMosque*; do echo "== $f"; head -120 "$f"; done
            log show --last 2m --predicate 'process == "NearMosque"' --style compact 2>/dev/null | tail -60 || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: ios/shots-mac/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mac-build-log
          path: ios/mac.log

  # The Mac app as a tester first meets it: macOS 26, a Release build in the App Sandbox, launched with
  # no saved settings at all (so the welcome screens open). It must still be running after a while;
  # otherwise the crash report is printed.
  mac-first-launch:
    name: Mac app first launch (macOS 26, Release, sandbox)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          sw_vers
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (Release, Mac Catalyst) and sign ad hoc with the sandbox
        run: |
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath ddrel \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee macrel.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" macrel.log
          cat > /tmp/sandbox.entitlements <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.network.client</key><true/>
            <key>com.apple.security.personal-information.location</key><true/>
          </dict></plist>
          XML
          APP="$PWD/ddrel/Build/Products/Release-maccatalyst/NearMosque.app"
          find "$APP/Contents" \( -name "*.framework" -o -name "*.dylib" \) -prune -exec codesign -f -s - {} \; 2>/dev/null || true
          for x in "$APP"/Contents/PlugIns/*.appex; do codesign -f -s - --entitlements /tmp/sandbox.entitlements "$x"; done
          codesign -f -s - --entitlements /tmp/sandbox.entitlements "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: First launch with no saved settings stays up
        run: |
          defaults delete sa.zood.nearmosque 2>/dev/null || true
          rm -rf ~/Library/Containers/sa.zood.nearmosque ~/Library/Preferences/sa.zood.nearmosque.plist ~/Library/Logs/DiagnosticReports/NearMosque* 2>/dev/null || true
          mkdir -p shots-mac26
          open -n "$APP"
          sleep 8; screencapture -x shots-mac26/01-after-8s.png || true
          sleep 22
          if pgrep -x NearMosque >/dev/null; then
            echo "The Mac app is running after its first launch."
            screencapture -x shots-mac26/02-after-30s.png || true
            pkill -x NearMosque || true
          else
            echo "::error::The Mac app quit within 30 seconds of its first launch."
            for f in ~/Library/Logs/DiagnosticReports/NearMosque*; do echo "== $f"; head -150 "$f"; done
            log show --last 3m --predicate 'process == "NearMosque"' --style compact 2>/dev/null | grep -iE "fault|error|exception|terminat|assert" | tail -60 || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac26-first-launch
          path: ios/shots-mac26/

  tvos:
    name: Apple TV app (tvOS simulator build and screenshots)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 50
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Release build for Apple TV (unsigned, same configuration TestFlight uses)
        run: |
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosqueTV -configuration Release \
            -destination 'generic/platform=tvOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee tvrel.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" tvrel.log
      - name: Run in the Apple TV simulator and capture screenshots
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          rts=sorted([k for k in d if 'tvOS' in k], key=lambda k: [int(x) for x in k.split('tvOS-')[-1].split('-')])
          for rt in reversed(rts):
              for dev in d[rt]:
                  if dev['name'].startswith('Apple TV 4K'):
                      print(dev['udid']); sys.exit()
          ")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosqueTV -configuration Debug \
            -destination "platform=tvOS Simulator,id=$UDID" -derivedDataPath ddtv CODE_SIGNING_ALLOWED=NO build 2>&1 | tee tvsim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" tvsim.log
          xcrun simctl install "$UDID" ddtv/Build/Products/Debug-appletvsimulator/NearMosqueTV.app
          mkdir -p shots-tv
          shot() { name=$1; shift
            xcrun simctl terminate "$UDID" sa.zood.nearmosque 2>/dev/null || true
            xcrun simctl launch "$UDID" sa.zood.nearmosque "$@"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots-tv/$name.png"
          }
          shot 01-setup -languageOverride en
          shot 02-board-en -demoCity London -languageOverride en
          shot 03-board-ar -demoCity Cairo -languageOverride ar
          shot 04-qibla -demoCity London -demoTab qibla -languageOverride en
          shot 05-mosques -demoCity London -demoTab mosques -languageOverride en
          shot 06-mosques-ar -demoCity Cairo -demoTab mosques -languageOverride ar
          shot 07-settings -demoCity London -demoTab settings -languageOverride en
          shot 08-alert -demoCity London -demoAlert YES -languageOverride en
          shot 09-alert-ar -demoCity Cairo -demoAlert YES -languageOverride ar
          shot 10-top-shelf -demoCity London -demoTopShelf YES -languageOverride en
          shot 11-top-shelf-ar -demoCity Cairo -demoTopShelf YES -languageOverride ar
          # Read the list first: grep -q in a pipe ends early and pipefail reports the broken pipe.
          running=$(xcrun simctl spawn "$UDID" launchctl list || true)
          if ! grep -q "sa.zood.nearmosque" <<<"$running"; then
            echo "::error::The Apple TV app is not running after the last screenshot."; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvos-screenshots
          path: |
            ios/shots-tv/
            ios/tvrel.log
            ios/tvsim.log
