name: Nearest Mosque apps

on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repository is private: macOS minutes count several times against the Actions allowance, so the
  # iOS job runs only when iOS code, shared assets or packs change (always on manual runs and PRs).
  changes:
    name: Decide which platform jobs run
    runs-on: ubuntu-24.04
    outputs:
      ios: ${{ steps.c.outputs.ios }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: c
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(ios/|shared/|packs/|\.github/workflows/ci\.yml)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  shared:
    name: Shared strings and fixtures are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strings generated from shared/i18n/strings.json
        run: python3 tools/gen_strings.py --check
      - name: Design tokens (contrast, theme parity)
        run: python3 tools/check_tokens.py
      - name: Golden fixtures regenerate identically
        run: |
          python3 tools/gen_fixtures.py
          python3 tools/reference_search.py --gen
          python3 tools/library_search.py --gen
          python3 tools/semantic.py --gen
          python3 tools/refresh_questions.py
          git diff --exit-code -- shared/fixtures packs/sources/quran-tanzil-pickthall

  android:
    name: Android (unit, Robolectric, screenshots, APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:recordRoborazziDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots-and-apk
          path: |
            android/app/build/screenshots/*.png
            android/app/build/outputs/apk/debug/*.apk
            android/*/build/test-results/**/*.xml

  swift-linux:
    name: NearestMosqueKit on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: swift test
        working-directory: ios/Packages/NearestMosqueKit
        # NMCore here; the data-layer tests (which install the large library packs) run in the Linux job.
        run: swift test --filter NMCoreTests

  ios:
    name: iOS app (Xcode, simulator build) and package tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Package tests (macOS, CryptoKit path)
        working-directory: ios/Packages/NearestMosqueKit
        run: swift test
      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: .*NearMosque|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Release build for devices (unsigned, same configuration TestFlight uses)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tee release.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" release.log
      - name: Run in the iOS Simulator and capture screenshots
        working-directory: ios
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          rts=sorted([k for k in d if 'iOS' in k], key=lambda k: [int(x) for x in k.split('iOS-')[-1].split('-')])
          for rt in reversed(rts):
              for dev in d[rt]:
                  if dev['name'].startswith('iPhone') and 'Pro' in dev['name'] and 'Max' not in dev['name']:
                      print(dev['udid']); sys.exit()
          ")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project NearMosque.xcodeproj -scheme NearMosque -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build -quiet
          APP=dd/Build/Products/Debug-iphonesimulator/NearMosque.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location sa.zood.nearmosque || true
          xcrun simctl location "$UDID" set -33.9249,18.4241 || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          mkdir -p shots
          # The app follows the phone's appearance: shots in light mode first, then a few in dark mode.
          xcrun simctl ui "$UDID" appearance light || true
          shot() { name=$1; shift
            xcrun simctl terminate "$UDID" sa.zood.nearmosque 2>/dev/null || true
            xcrun simctl launch "$UDID" sa.zood.nearmosque "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot 01-onboarding-welcome -demoOnboarding YES -demoOnboardingPage 0 -languageOverride en
          shot 02-onboarding-qibla -demoOnboarding YES -demoOnboardingPage 2 -languageOverride en
          shot 03-onboarding-mosque -demoOnboarding YES -demoOnboardingPage 3 -languageOverride en
          shot 04-onboarding-ask -demoOnboarding YES -demoOnboardingPage 4 -languageOverride en
          shot 04b-onboarding-setup -demoOnboarding YES -demoOnboardingPage 5 -languageOverride en
          shot 05-prayer-en -demoCity "Cape Town" -demoTab prayer -languageOverride en
          shot 06-prayer-ar -demoCity "Cape Town" -demoTab prayer -languageOverride ar
          shot 06b-qibla-compass -demoCity "Cape Town" -demoTab prayer -demoCompass YES -languageOverride en
          shot 06c-compact-bar -demoCity "Cape Town" -demoTab prayer -demoCompact YES -languageOverride en
          shot 06d-compact-bar-ar -demoCity "Cape Town" -demoTab prayer -demoCompact YES -languageOverride ar
          shot 07-mosques-compass -demoCity "Cape Town" -demoTab mosques -demoMosqueMode 0 -languageOverride en
          shot 08-mosques-map -demoCity "Cape Town" -demoTab mosques -demoMosqueMode 1 -languageOverride en
          shot 09-ask-answer -demoCity "Cape Town" -demoTab ask -demoAsk YES -languageOverride en
          shot 10-ask-ar -demoCity "Cape Town" -demoTab ask -languageOverride ar
          # Home-screen widgets at their real sizes (debug gallery; same views as the widget extension).
          shot 17-widgets-next -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind next -demoWidgetLook cream -languageOverride en
          shot 18-widgets-countdown -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind countdown -demoWidgetLook green -languageOverride en
          shot 19-widgets-today -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind today -demoWidgetLook night -languageOverride en
          shot 20-widgets-next-ar -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind next -demoWidgetLook green -languageOverride ar
          shot 21-widgets-today-ar -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind today -demoWidgetLook cream -languageOverride ar
          shot 22-widgets-mosque -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind mosque -demoWidgetLook cream -languageOverride en
          shot 23-widgets-ask-ar -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind ask -demoWidgetLook night -languageOverride ar
          shot 24-widgets-ring-ar -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind ring -demoWidgetLook cream -languageOverride ar
          shot 25-widgets-ring -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind ring -demoWidgetLook night -languageOverride en
          shot 26-widgets-qibla -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind qibla -demoWidgetLook green -languageOverride en
          shot 27-widgets-qibla-ar -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind qibla -demoWidgetLook cream -languageOverride ar
          shot 28-widgets-actions -demoCity "Cape Town" -demoWidgets YES -demoWidgetKind actions -demoWidgetLook night -languageOverride en
          xcrun simctl ui "$UDID" appearance dark || true
          shot 11-prayer-dark -demoCity "Cape Town" -demoTab prayer -languageOverride en
          shot 11b-compact-bar-dark -demoCity "Cape Town" -demoTab prayer -demoCompact YES -languageOverride en
          shot 12-mosques-dark -demoCity "Cape Town" -demoTab mosques -demoMosqueMode 0 -languageOverride en
          shot 13-ask-answer-dark -demoCity "Cape Town" -demoTab ask -demoAsk YES -languageOverride en
          # Large text (Settings → Accessibility → Larger Text): nothing may be cut or overlap.
          xcrun simctl ui "$UDID" content_size accessibility-medium || true
          shot 14-prayer-large-text -demoCity "Cape Town" -demoTab prayer -languageOverride en
          shot 15-compact-bar-large-text -demoCity "Cape Town" -demoTab prayer -demoCompact YES -languageOverride en
          shot 16-ask-large-text -demoCity "Cape Town" -demoTab ask -languageOverride en
          xcrun simctl ui "$UDID" content_size medium || true
          ls -la shots
          # Contact sheet for quick review.
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet pillow
          /tmp/venv/bin/python - <<'PY'
          import glob
          from PIL import Image
          ims = [Image.open(f).convert("RGB") for f in sorted(glob.glob("shots/*.png"))]
          w = 300; h = int(ims[0].height * w / ims[0].width); cols = 6
          sheet = Image.new("RGB", (cols * w, ((len(ims) + cols - 1) // cols) * h), "white")
          for i, im in enumerate(ims):
              sheet.paste(im.resize((w, h)), ((i % cols) * w, (i // cols) * h))
          sheet.save("shots/contact-sheet.jpg", quality=80)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: ios/shots/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ios/build.log
