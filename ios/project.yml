# XcodeGen spec: `xcodegen generate` (CI: .github/workflows/ci.yml; TestFlight: .github/workflows/testflight.yml).
name: NearMosque
options:
  bundleIdPrefix: sa.zood
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  NearestMosqueKit:
    path: Packages/NearestMosqueKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    DEVELOPMENT_TEAM: AWV883QWPU
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    # The app's bundle id; the widget extension is $(APP_BUNDLE_ID).widgets (TestFlight overrides this one value).
    APP_BUNDLE_ID: sa.zood.nearmosque
targets:
  NearMosque:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../packs
        type: folder
        buildPhase: resources
      - path: ../shared/content/stopwords.json
        buildPhase: resources
      - path: ../shared/content/lexicon.json
        buildPhase: resources
      - path: ../shared/semantic/model.bin
        buildPhase: resources
    dependencies:
      - package: NearestMosqueKit
        product: NMCore
      - package: NearestMosqueKit
        product: NMData
      - target: NearMosqueWidgets
    entitlements:
      path: App/NearMosque.entitlements
      properties:
        # Shared with the widgets (city, method, language) without an App Group.
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Near Mosque
        SharedKeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        # Widgets open the app with nearmosque://prayer, nearmosque://qibla or nearmosque://ask.
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [nearmosque]
        # Directions can open Google Maps or Waze when installed (canOpenURL needs the schemes listed).
        LSApplicationQueriesSchemes: [comgooglemaps, waze]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ar, ur, tr, id, fr, es]
        CFBundleAllowMixedLocalizations: false
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSAlarmKitUsageDescription: Rings the Fajr alarm you set in Settings.
        NSLocationWhenInUseUsageDescription: Your location is used on this phone for prayer times, the Qibla and nearby mosques. Only an approximate location is sent, and only when online mosque search is on.
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  NearMosqueWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/Resources/Localizable.xcstrings
    dependencies:
      - package: NearestMosqueKit
        product: NMCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/NearMosqueWidgets.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Near Mosque
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ar, ur, tr, id, fr, es]
        SharedKeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  NearMosque:
    build:
      targets:
        NearMosque: all
    run:
      config: Debug
